name: Generate ICS

on:
  schedule:
    - cron: '*/20 * * * *'  # Runs every 20 minutes
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write  # needed to push the generated file to gh-pages

concurrency:
  group: generate-ics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python main.py  # exits non-zero (and nothing is published) if the API can't be trusted

      - name: Publish ICS to gh-pages (only when changed)
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # FETCH_HEAD, not origin/gh-pages: the checkout is single-branch so no tracking ref is created
          if git fetch --depth 1 origin gh-pages; then
            git worktree add --detach gh-pages FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages gh-pages
          fi
          cp soccer_schedule.ics gh-pages/
          cd gh-pages
          git add soccer_schedule.ics
          if git diff --cached --quiet; then
            echo "Schedule unchanged; nothing to publish"
          else
            git commit -m "Update soccer_schedule.ics"
            git push origin HEAD:gh-pages
          fi
